# BLE: щоп'ять секунд кладемо свіже значення в характеристику і шлемо notify
interval:
  - interval: 5s
    then:
      - ble_server.characteristic.set_value:
          id: ble_voltage
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_total_voltage).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_voltage
      - ble_server.characteristic.set_value:
          id: ble_current
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_current).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_current
      - ble_server.characteristic.set_value:
          id: ble_power
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_power).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_power
      - ble_server.characteristic.set_value:
          id: ble_soc
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_soc).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_soc
      - ble_server.characteristic.set_value:
          id: ble_soh
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_soh).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_soh
      - ble_server.characteristic.set_value:
          id: ble_temperature
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_temperature).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_temperature
      - ble_server.characteristic.set_value:
          id: ble_charge_voltage
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_charge_voltage).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_charge_voltage
      - ble_server.characteristic.set_value:
          id: ble_charge_current
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_charge_current_limit).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_charge_current
      - ble_server.characteristic.set_value:
          id: ble_discharge_current
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_discharge_current_limit).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_discharge_current
      - ble_server.characteristic.set_value:
          id: ble_discharge_voltage
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_discharge_voltage).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_discharge_voltage
      - ble_server.characteristic.set_value:
          id: ble_capacity
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_capacity).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_capacity
      - ble_server.characteristic.set_value:
          id: ble_charging_power
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_charging_power).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_charging_power
      - ble_server.characteristic.set_value:
          id: ble_discharging_power
          value:
            data: !lambda 'return bytebuffer::ByteBuffer::wrap(id(dyness_discharging_power).state).get_data();'
      - ble_server.characteristic.notify:
          id: ble_discharging_power
      - ble_server.characteristic.set_value:
          id: ble_battery_name
          value:
            data: !lambda |-
              const std::string name = id(battery_name).state;
              return std::vector<uint8_t>(name.begin(), name.end());
      - ble_server.characteristic.notify:
          id: ble_battery_name
